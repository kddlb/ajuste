[workspace]
resolver = "2"
members = ["crates/scape-proto", "crates/scape-hid", "crates/ajustectl", "crates/ajuste"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kddlb/ajuste"

[workspace.dependencies]
scape-proto = { path = "crates/scape-proto" }
scape-hid = { path = "crates/scape-hid" }
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
