gpui-kit = "0.9"
ksni = { version = "0.3", features = ["blocking"] }
notify-rust = "4.19"
toml = "0.9"
directories = "6"
uuid = { version = "1", features = ["v4"] }
env_logger = "0.11"
async-channel = "2.5"
